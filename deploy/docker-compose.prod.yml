# The whole system on one server: database, API, website, and (pick one) Caddy or a Cloudflare tunnel.
#
#   cp deploy/.env.example deploy/.env      (then edit it)
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env --profile caddy up -d --build
#
# Use "--profile tunnel" instead of "--profile caddy" to reach it through a Cloudflare tunnel (no open ports needed).
name: distribution

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: dist
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: distribution
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dist -d distribution"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No ports are published: only the API, inside this compose network, can reach the database.

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dist:${DB_PASSWORD}@db:5432/distribution
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in deploy/.env}
      # Dates (what counts as "today") follow shop time, not the server's.
      TZ: ${APP_TZ:-Asia/Karachi}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
    volumes:
      # ":z" lets the container use this folder on servers that run SELinux (Oracle Linux, Fedora, RHEL); other systems ignore it.
      - ${BACKUP_HOST_DIR:-../backups}:/app/backups:z

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in deploy/.env}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    profiles: ["caddy"]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      WEB_HOST: ${WEB_HOST:-}
      API_HOST: ${API_HOST:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - web
      - api
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
